{% extends 'base.html' %}
{% block title %}Log in | MarketGo{% endblock %}
{% block content %}
<section class="login-page">
  <div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Your marketplace,<br />right where you left it.</h1>
  </div>
  <form method="post" class="form-card">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
    <label
      >Username<input name="username" required autofocus /></label
    ><label>Password<input name="password" type="password" required /></label
    ><button class="button primary full" type="submit">Log in</button>
    <p class="muted">New here? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
  </form>
</section>
{% endblock %}
